<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Maxline Global Email Signature</title>
</head>

<body style="margin: 0; padding: 0; background-color: #ffffff;">

  <!-- Outer Container Table -->
  <table cellpadding="0" cellspacing="0" border="0" width="600"
    style="font-family: metrify, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; min-width: 480px; max-width: 600px; padding: 10px; background-color: #ffffff;">
    <tr>
      <td>

        <!-- Main Content Table (Top Section) -->
        <table cellpadding="0" cellspacing="0" border="0" width="100%">
          <tr>
            <!-- Logo Column -->
            <td width="130" valign="top" style="vertical-align: top; padding-right: 20px;">
              <a href="https://maxlineglobal.com/en" target="_blank" style="text-decoration: none; display: block;">
                <img src="/assets/Maxline - Logo.png" alt="Maxline Global" width="120"
                  style="display: block; border: 0; width: 120px; height: auto; max-width: 100%;">
              </a>
            </td>

            <!-- Vertical Divider -->
            <td width="2"
              style="width: 2px; border-left: 2px solid #078CD9; padding: 0; margin: 0; vertical-align: top;"
              valign="top"></td>

            <!-- Details Column -->
            <td valign="top" style="vertical-align: top; padding-left: 20px;">

              <!-- Company Header -->
              <h2
                style="margin: 0 0 2px 0; color: #078CD9; font-size: 18px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; font-family: metrify, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                MAXLINE GLOBAL
              </h2>
              <p
                style="margin: 0 0 14px 0; color: #6B7280; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-family: metrify, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                Global Logistics & Freight Solutions
              </p>

              <!-- Contact Information Table -->
              <table cellpadding="0" cellspacing="0" border="0"
                style="font-size: 12px; color: #4B5563; line-height: 1.6; font-family: metrify, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                <!-- Address -->
                <tr>
                  <td valign="middle" style="padding-bottom: 5px; vertical-align: middle; width: 22px;">
                    <img src="https://img.icons8.com/ios-filled/24/078CD9/marker.png" width="12" height="12"
                      style="display: block; border: 0; width: 12px; height: 12px;" alt="Address">
                  </td>
                  <td valign="middle" style="padding-bottom: 5px; vertical-align: middle; color: #4B5563;">
                    Jebel Ali Free Zone, Dubai, UAE
                  </td>
                </tr>
                <!-- Email -->
                <tr>
                  <td valign="middle" style="padding-bottom: 5px; vertical-align: middle; width: 22px;">
                    <img src="https://img.icons8.com/ios-filled/24/078CD9/new-post.png" width="12" height="12"
                      style="display: block; border: 0; width: 12px; height: 12px;" alt="Email">
                  </td>
                  <td valign="middle" style="padding-bottom: 5px; vertical-align: middle; color: #4B5563;">
                    <a href="mailto:info@maxlineglobal.com"
                      style="color: #4B5563; text-decoration: none;">info@maxlineglobal.com</a>
                  </td>
                </tr>
                <!-- Website -->
                <tr>
                  <td valign="middle" style="padding-bottom: 5px; vertical-align: middle; width: 22px;">
                    <img src="https://img.icons8.com/ios-filled/24/078CD9/globe.png" width="12" height="12"
                      style="display: block; border: 0; width: 12px; height: 12px;" alt="Website">
                  </td>
                  <td valign="middle" style="padding-bottom: 5px; vertical-align: middle; color: #4B5563;">
                    <a href="https://www.maxlineglobal.com" target="_blank"
                      style="color: #4B5563; text-decoration: none;">www.maxlineglobal.com</a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

      </td>
    </tr>

    <!-- Dark Footer Banner Section -->
    <tr>
      <td style="padding-top: 15px;">
        <table cellpadding="0" cellspacing="0" border="0" width="100%"
          style="background-color: #231F20; border-radius: 4px; overflow: hidden;">
          <tr>
            <td style="padding: 12px 16px;">

              <!-- Banner Row 1: Divider Line & Social Handles -->
              <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <!-- Left-side horizontal divider line -->
                  <td valign="middle" style="padding-right: 12px;">
                    <div style="border-top: 1px solid #4B5563; height: 1px; line-height: 1px;"></div>
                  </td>
                  <!-- Right-side social handles -->
                  <td width="150" align="right" valign="middle"
                    style="white-space: nowrap; color: #FFFFFF; font-size: 11px; font-weight: bold; font-family: metrify, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                    <a href="https://www.facebook.com/maxlineglobal" target="_blank"
                      style="text-decoration: none; display: inline-block; margin-right: 6px; vertical-align: middle;">
                      <img src="https://img.icons8.com/ios-filled/24/FFFFFF/facebook-new.png" width="12" height="12"
                        style="display: block; border: 0;" alt="Facebook">
                    </a>
                    <a href="https://www.instagram.com/maxlineglobal/" target="_blank"
                      style="text-decoration: none; display: inline-block; margin-right: 6px; vertical-align: middle;">
                      <img src="https://img.icons8.com/ios-filled/24/FFFFFF/instagram-new.png" width="12" height="12"
                        style="display: block; border: 0;" alt="Instagram">
                    </a>
                    <a href="https://wa.me/97142822022" target="_blank"
                      style="text-decoration: none; display: inline-block; margin-right: 6px; vertical-align: middle;">
                      <img src="https://img.icons8.com/ios-filled/24/FFFFFF/whatsapp.png" width="12" height="12"
                        style="display: block; border: 0;" alt="WhatsApp">
                    </a>
                    <span
                      style="border-left: 1px solid #4B5563; padding-left: 6px; vertical-align: middle; color: #FFFFFF;">maxlineglobal</span>
                  </td>
                </tr>
              </table>

              <!-- Vertical spacing -->
              <div style="height: 8px; line-height: 8px;"></div>

              <!-- Banner Row 2: Phone Icon & country list -->
              <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <!-- Phone number with blue phone icon -->
                  <td align="left" valign="middle"
                    style="color: #FFFFFF; font-size: 13px; font-weight: bold; font-family: metrify, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                    <img src="https://img.icons8.com/ios-filled/24/078CD9/phone.png" width="12" height="12"
                      style="display: inline-block; vertical-align: middle; margin-right: 4px;" alt="Phone">
                    <span style="vertical-align: middle; color: #FFFFFF;">+971 42 822 022</span>
                  </td>
                  <!-- Location Countries -->
                  <td align="right" valign="middle"
                    style="color: #D1D5DB; font-size: 9px; font-weight: 500; font-family: metrify, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0.3px;">
                    UAE | China | K.S.A | Oman | Qatar | Bahrain | Kuwait | UK | India
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Divider & Disclaimer -->
    <tr>
      <td style="padding-top: 15px;">
        <table cellpadding="0" cellspacing="0" border="0" width="100%"
          style="border-top: 1px solid #E5E7EB; padding-top: 10px;">
        </table>
      </td>
    </tr>
  </table>

</body>

</html>
